<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slayers 2 Loadout Optimizer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Shippori+Mincho:wght@600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Slayers 2 Loadout Optimizer</h1>
<nav class="nav" aria-label="Pages"><a id="nav-opt" href="#optimizer" aria-current="page">Optimizer</a><a id="nav-items" href="#my-items">My items<span class="badge hide" id="nav-badge"></span></a></nav>
</header>
<div class="wrap">
<aside class="panel ctl">
<h2>Goal</h2>
<label>Maximize
<select id="goal">
<option value="exp">Damage per hit with crits (DPS)</option>
<option value="hit">Hit damage, no crit</option>
<option value="crit">Crit hit damage</option>
<option value="hp">Max HP</option>
<option value="def">Defense (full hit, no block)</option>
<option value="sta">Max stamina</option>
<option value="spd">Movement speed</option>
<option value="custom">Custom weights</option>
</select></label>
<fieldset id="f-dmg">
<div class="two"><label>Base hit damage<input type="number" id="base" value="3" min="0" step="any"></label>
<label>Base crit chance %<input type="number" id="cc" value="0" min="0" max="100" step="any"></label></div>
<label>Base crit bonus %<input type="number" id="cb" value="50" min="0" step="any"></label>
</fieldset>
<fieldset id="f-hp">
<label>Base max HP<input type="number" id="hp" value="100" min="0" step="any"></label>
<div class="two hide" id="f-rng"><label>Smallest hit<input type="number" id="dlo" value="5" min="1" step="any"></label>
<label>Biggest hit<input type="number" id="dhi" value="500" min="1" step="any"></label></div>
</fieldset>
<fieldset id="f-cus" class="hide">
<div class="wts" id="wts"></div>
</fieldset>
<h2>Rules</h2>
<label class="row"><input type="checkbox" id="onecat" checked>One item per category</label>
<label class="row"><input type="checkbox" id="owned">Only items I own</label>
<label class="row"><input type="checkbox" id="noevt" checked>Hide unobtainable (dev and staff) items</label>
<label class="row"><input type="checkbox" id="tit" checked>Include titles (3 boost slots)</label>
<label class="row" id="l-town"><input type="checkbox" id="town" checked>Only titles I've unlocked</label>
<label class="row"><input type="checkbox" id="lant">Include Lantern</label>
<label class="row hide" id="l-calc"><input type="checkbox" id="lcalc">Include calculation</label>
<label id="l-lant" class="hide">Lantern<select id="lantern"></select></label>
<div class="two"><label>Set tier<select id="tier"><option value="1">1 (×1)</option><option value="2">2 (×1.15)</option><option value="3" selected>3 (×1.3)</option></select></label>
<label>Refine level<select id="refine"></select></label></div>
</aside>
<main>
<div class="panel lo" id="lo-bar">
<div class="lo-tabs" id="lo-tabs" role="group" aria-label="Loadouts"></div>
<div class="lo-act"><label class="lo-name">Rename<input type="text" id="lo-name" maxlength="24" autocomplete="off"></label>
<button type="button" class="btn" id="lo-add">+ Add new loadout</button><button type="button" class="btn pri" id="lo-equip" disabled>Equip suggested set</button></div>
</div>
<div id="o-body"><div class="panel" id="out"></div>
<aside class="panel detail hide" id="o-detail" aria-label="Item details"></aside></div>

</main>
</div>
<div id="items-page" class="hide">
<div class="panel">
<div class="i-tools"><input type="search" id="pg-q" placeholder="Search items" aria-label="Search items"><button type="button" class="btn pri" id="pg-go">Search</button><button type="button" class="btn" id="pg-clear">Clear</button>
<select id="pg-f" aria-label="Show"><option value="all">All items</option><option value="yes">Owned / unlocked only</option><option value="no">Not owned / locked only</option></select></div>
<div class="i-sum" style="margin-top:12px"><span><b class="num" id="pg-total"></b> <span class="hint" id="pg-shown"></span></span>
<span class="cat-btns"><button type="button" class="btn" id="pg-all">Tick all shown</button><button type="button" class="btn" id="pg-none">Untick all shown</button><button type="button" class="btn" id="pg-reset">Reset to save</button><button type="button" class="btn hide" id="pg-exclear">Clear exclusions</button></span></div>
<div class="chips" id="pg-chips" style="margin-top:12px" role="group" aria-label="Jump to category"></div>
</div>
<div id="i-body"><div><div id="items-cats" style="display:grid;gap:16px"></div>
<div class="empty hide" id="pg-empty">No items match that search.</div></div>
<aside class="panel detail hide" id="i-detail" aria-label="Item details"></aside></div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
